<p class="ti-art">Article 7</p><p class="sti-art">Registre des traitements</p>
<p class="normal">Chaque responsable tient un registre fictif des activités de traitement.</p>
<p class="ti-section-1">CHAPITRE II</p>
<p class="ti-art">Article 8</p><p class="sti-art">Analyse d'impact</p>
<p class="normal">Une analyse d'impact fictive est réalisée lorsque le traitement présente un risque élevé.</p>
